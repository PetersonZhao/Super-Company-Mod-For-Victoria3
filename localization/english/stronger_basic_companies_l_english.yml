 company_international_commercial_group_desc: "An international commercial group founded by Henry John Heinz, connecting agriculture, fisheries, food, textiles, and port logistics. Once prosperous at a monthly check, permanently unlocks a Universal Education Network: all owned incorporated states gain +50 percentage points of education access and +0.10% literacy growth, including states incorporated later."

 company_global_construction_group: "Global Construction Group"
 company_global_construction_group_desc: "An integrated construction group founded by Alfred Nobel, combining steel, glass, explosives, furniture, and large engineering projects."

 company_military_industrial_complex: "Military Industrial Complex"
 company_military_industrial_complex_desc: "An integrated arms and shipbuilding enterprise founded by Hiram Stevens Maxim, supplying weapons, ammunition, artillery, and modern vessels."

 company_petrochemical_giant: "Petrochemical Giant"
 company_petrochemical_giant_desc: "An integrated petroleum, chemical, synthetic-material, and railway enterprise founded by Carl Bosch."

 company_international_financial_group: "International Financial Group"
 company_international_financial_group_desc: "A financial and industrial group founded by Nathan Mayer Rothschild, connecting capital with timber, paper, and tooling production."

 company_tech_industrial_group: "Tech Industrial Group"
 company_tech_industrial_group_desc: "A research-driven electrical group founded by Gerard Philips, advancing power, electronics, radio, and higher education."

