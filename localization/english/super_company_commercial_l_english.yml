 super_company_commercial.1.t: "International Commercial Group: Capital in Common"
 super_company_commercial.1.d: "The International Commercial Group has entered prosperity. Accounts from farms, textile mills, food manufacturers, and ports have been brought together in a report that investors across the country can examine. Merchants see that a large enterprise need not depend on a single family's savings: dividing its capital into transferable shares allows many investors to share both its risks and its returns.\n\nThe Group has offered its shareholder registers, dividend rules, and common accounting practices to scholars and chambers of commerce, while promoting deposits, lending, and bill settlement. It has also proposed a central bank to coordinate interbank clearing and currency issuance. Its prosperity provides a working model for the development of joint-stock companies, banking, and central banking."
 super_company_commercial.1.f: "\"One share cannot buy a factory. Thousands of small savings can light its furnaces together.\""
 super_company_commercial.1.a: "Let this prosperity become a common enterprise."
