 super_company_education_network: "International Commercial Group: Universal Education Network"
 super_company_education_network_desc: "A permanent education endowment established after the International Commercial Group became prosperous, funding local schools, public libraries, and adult literacy classes. Adds 50 percentage points of education access and 0.10% literacy growth. The endowment survives a loss of prosperity or dissolution of the company."
