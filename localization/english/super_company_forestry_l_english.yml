l_english:
 super_company_forestry.1.t: "International Financial Group: Collateral That Grows"
 super_company_forestry.1.d: "At the International Financial Group's annual shareholders' meeting, a glass case is placed on the table. Inside, a sapling is slowly pressing its branches against the copper frame. Yesterday's measurements in the ledger are already obsolete.\n\nThe Group's Tree-Ring Bonds funded experimental nurseries. Pulsed electric fields and symbiotic fungi have produced fast-growing trees that compress the long wait for timber into a few growing seasons. Rotational woodland management will maintain a lasting supply. The bankers intend to turn this breakthrough into a new form of collateral: a forest that appreciates by itself.\n\nThis year's fund will establish nurseries and register additional managed woodland in one incorporated state. Its dividends will enter the market as timber, paper, and tools."
 super_company_forestry.1.f: "\"Cash does not grow in a vault. Our collateral grows taller every day.\"\n\n—The International Financial Group forestry assets office, in an open letter to shareholders"
 super_company_forestry.1.a: "Invest this year's fund in a new woodland estate."
 super_company_forestry.2.t: "Tree-Ring Bonds: Choose a Forestry Site"
 super_company_forestry.2.d: "The forestry assets office has shortlisted eligible states. Choose a fully incorporated state whose entire state region belongs to our country.\n\nEach page lists up to four states. Final approval permanently increases the selected state’s logging camp capacity by #bold 50#! levels. Existing farmland and other resources are unaffected."
 super_company_forestry.2.empty.d: "Changes in land registration have left no eligible states on the shortlist. The forestry assets office recommends reserving this year's fund until a suitable site can be chosen in a future year."
 super_company_forestry.2.f: "\"We are not buying this season’s timber. We are buying the logs that can arrive every season thereafter.\"\n\n—Forestry asset valuation report"
 super_company_forestry.3.t: "Tree-Ring Bonds: Put the Returns into the Forest"
 super_company_forestry.3.d: "The woodland boundaries and nursery sites in [SCOPE.sState('super_company_forestry_selected_state').GetName] have been surveyed. Glass cases containing seeds and fungal cultures await shipment. Foresters will divide the estate into rotational management blocks, converting the nursery results into lasting timber reserves.\n\nSigning the contract permanently increases this state's logging camp capacity by #bold 50#! levels. The International Financial Group pays this year's development costs. Logging camps still require normal construction and workers."
 super_company_forestry.3.invalid.d: "The forestry contract can no longer be carried out. The International Financial Group may have been dissolved, or the selected state may no longer meet the ownership and incorporation requirements. Reassess the site or reserve this year’s fund."
 super_company_forestry.3.f: "\"Projected returns: upward. The treetops, too.\"\n\n—An auditor’s marginal note on the contract"
 super_company_forestry.3.a: "Sign the contract. Let the forest earn its interest."
 super_company_forestry.previous: "Previous woodland sites."
 super_company_forestry.next: "Next woodland sites."
 super_company_forestry.back: "Reassess the investment site."
 super_company_forestry.cancel: "Reserve this year's forestry fund."
 super_company_forestry_choose_tt: "Choose a fully owned, incorporated state to permanently add #bold 50#! levels of logging resource capacity."
 super_company_forestry_preview_tt: "Review this forestry contract. Logging resource capacity changes only after final approval."
 super_company_forestry_page_tt: "Continue reviewing the shortlist without using this year’s forestry investment."
 super_company_forestry_cancel_tt: "No logging resources are added this year. Future annual investments remain available while the International Financial Group exists."
 super_company_forestry_gain_tt: "[SCOPE.sState('super_company_forestry_selected_state').GetName] permanently gains #bold 50#! levels of logging camp capacity. The Group pays development costs; logging camps are not automatically built."
