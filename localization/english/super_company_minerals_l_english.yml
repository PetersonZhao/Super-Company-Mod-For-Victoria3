l_english:
 super_company_minerals.1.t: "Global Mining Resources Group: The Second Knock Below"
 super_company_minerals.1.d: "[CONFIDENTIAL SURVEY TELEGRAM, 02:17]\nAfter the drill stopped, three evenly spaced knocks continued from below. The Global Mining Resources Group’s Echo Engine then traced a deep mineral belt absent from every previous survey.\n\nAn assembly of gravity pendulums, crystal oscillators, and a difference engine translates minute tremors into a three-dimensional section of the earth, finding routes for directional drilling. The Group requests permission to use this year’s single full-power calibration in one incorporated state, targeting one mineral and bringing previously inaccessible deep deposits within reach.\n\nIron, coal, lead, sulfur, or gold: which echo is still waiting to be heard?"
 super_company_minerals.1.f: "\"We transmitted two pulses. Who made the third knock?\"\n\n—The night surveyor’s handwritten note on the back of the telegram"
 super_company_minerals.1.a: "Authorize calibration. Choose the survey area first."
 super_company_minerals.2.t: "Echo Engine: Deploy the Survey Array"
 super_company_minerals.2.d: "Choose a fully incorporated state whose entire state region belongs to our country. Surveyors will install gravity pendulums and receiving shafts there.\n\nEach page lists up to four states. After choosing a state, select iron, coal, lead, sulfur, or gold. Only final activation permanently adds #bold 50#! levels of capacity for the chosen mineral."
 super_company_minerals.2.empty.d: "Changes in land ownership and administration have left no suitable states on the original deployment list. This year’s calibration must be aborted until a future survey can choose another location."
 super_company_minerals.2.f: "There is no wind in the receiving shaft, yet every suspended brass weight leans in the same direction."
 super_company_minerals.3.t: "Echo Engine: The Final Calibration"
 super_company_minerals.3.invalid.d: "A red lamp illuminates the console. Company authorization or the selected state’s eligibility has lapsed, or no valid mineral has been selected. This calibration cannot proceed. Redeploy the array or abort this year’s mission."
 super_company_minerals.3.f: "\"The shaft walls are shaking. The paper tape is moving. Everyone step back, and do not touch the needle that is turning by itself.\"\n\n—The site engineer’s operating log"
 super_company_minerals.3.a: "Activate the engine and register the new deposits."
 super_company_minerals.4.t: "Decode the Echo: Select a Mineral Layer"
 super_company_minerals.4.d: "The receiving array in [SCOPE.sState('super_company_minerals_selected_state').GetName] is connected. Five overlapping waveforms run across the paper tape, each corresponding to a different deep mineral layer.\n\nThis year’s full-power calibration can lock onto only one target. Choose iron, coal, lead, sulfur, or gold. You may review both location and mineral before final activation."
 super_company_minerals.4.invalid.d: "The array lacks valid authorization for its deployment. The state may have changed hands, become divided, or lost incorporated status; the Group may also have been dissolved. Reassess the location or abort this year’s mission."
 super_company_minerals.4.f: "The curve marked gold is the thinnest. It also looks most like a human heartbeat."
 super_company_minerals.4.iron: "Iron: Follow the red mineral seam."
 super_company_minerals.4.coal: "Coal: Follow the deep carbon layer."
 super_company_minerals.4.lead: "Lead: Follow the heavy grey echo."
 super_company_minerals.4.sulfur: "Sulfur: Follow the hydrothermal channels."
 super_company_minerals.4.gold: "Gold: Follow the faintest echo."
 super_company_minerals.previous: "Previous survey areas."
 super_company_minerals.next: "Next survey areas."
 super_company_minerals.back: "Redeploy to another state."
 super_company_minerals.change_resource: "Decode again and change the mineral."
 super_company_minerals.cancel: "Cut the power. Abort this year’s calibration."
 super_company_minerals_choose_tt: "Choose a state and one mineral. Final approval permanently adds #bold 50#! levels of capacity for the selected mine type."
 super_company_minerals_preview_tt: "Continue to choose iron, coal, lead, sulfur, or gold in this state. No resources change yet."
 super_company_minerals_page_tt: "Reassess the deployment location without using this year’s calibration."
 super_company_minerals_resource_choice_tt: "Choose a different target mineral without changing resources or using this year’s opportunity."
 super_company_minerals_cancel_tt: "No minerals are added this year. Future annual calibrations remain available while the Global Mining Resources Group exists."
 super_company_minerals_gain_tt: "[SCOPE.sState('super_company_minerals_selected_state').GetName] permanently gains #bold 50#! levels of capacity for the chosen mineral only. The Group pays survey costs; mines still require normal construction."
 super_company_minerals.3.iron.d: "Target state: [SCOPE.sState('super_company_minerals_selected_state').GetName]. Target: #bold iron mine#!.\n\nThe red seam joins fractures linked to older workings. Previously inaccessible iron bodies now have a viable extraction route.\n\nActivation permanently adds #bold 50#! levels of iron mine capacity in this state only. Other minerals are unchanged. The Global Mining Resources Group pays survey costs; mines still require normal construction and workers."
 super_company_minerals_select_iron_tt: "Lock onto the iron mine layer and review final activation. Resources remain unchanged until approval."
 super_company_minerals.3.coal.d: "Target state: [SCOPE.sState('super_company_minerals_selected_state').GetName]. Target: #bold coal mine#!.\n\nOverlapping carbon beds form a black band across the section. A route has been found into deep coal deposits cut off by older faults.\n\nActivation permanently adds #bold 50#! levels of coal mine capacity in this state only. Other minerals are unchanged. The Global Mining Resources Group pays survey costs; mines still require normal construction and workers."
 super_company_minerals_select_coal_tt: "Lock onto the coal mine layer and review final activation. Resources remain unchanged until approval."
 super_company_minerals.3.lead.d: "Target state: [SCOPE.sState('super_company_minerals_selected_state').GetName]. Target: #bold lead mine#!.\n\nThe heavy grey waveform points toward a buried body of galena. Directional shafts can bypass the shattered rock and reach the overlooked layer.\n\nActivation permanently adds #bold 50#! levels of lead mine capacity in this state only. Other minerals are unchanged. The Global Mining Resources Group pays survey costs; mines still require normal construction and workers."
 super_company_minerals_select_lead_tt: "Lock onto the lead mine layer and review final activation. Resources remain unchanged until approval."
 super_company_minerals.3.sulfur.d: "Target state: [SCOPE.sState('super_company_minerals_selected_state').GetName]. Target: #bold sulfur mine#!.\n\nUnderground hydrothermal channels are marked one by one. The boundaries of condensed sulfur deposits emerge from the noise.\n\nActivation permanently adds #bold 50#! levels of sulfur mine capacity in this state only. Other minerals are unchanged. The Global Mining Resources Group pays survey costs; mines still require normal construction and workers."
 super_company_minerals_select_sulfur_tt: "Lock onto the sulfur mine layer and review final activation. Resources remain unchanged until approval."
 super_company_minerals.3.gold.d: "Target state: [SCOPE.sState('super_company_minerals_selected_state').GetName]. Target: #bold gold mine#!.\n\nThe faintest waveform converges below. Fine gold veins follow old hydrothermal fractures that new shafts can now reach.\n\nActivation permanently adds #bold 50#! levels of gold mine capacity in this state only. Other minerals are unchanged. The Global Mining Resources Group pays survey costs; mines still require normal construction and workers."
 super_company_minerals_select_gold_tt: "Lock onto the gold mine layer and review final activation. Resources remain unchanged until approval."
 super_company_minerals.2.state_1: "Deploy in [SCOPE.sState('super_company_minerals_state_1').GetName]."
 super_company_minerals.2.state_2: "Deploy in [SCOPE.sState('super_company_minerals_state_2').GetName]."
 super_company_minerals.2.state_3: "Deploy in [SCOPE.sState('super_company_minerals_state_3').GetName]."
 super_company_minerals.2.state_4: "Deploy in [SCOPE.sState('super_company_minerals_state_4').GetName]."
