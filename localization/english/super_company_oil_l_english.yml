l_english:
 super_company_oil.1.t: "Petrochemical Giant: Oilfield Number Zero"
 super_company_oil.1.d: "The Petrochemical Giant’s design office submits an unusual blueprint. Beneath the derricks there is no oil reservoir, only a network of thermal wells, return pipes, and catalytic reaction beds. The engineers call it the Subsurface Distillation Grid.\n\nCirculating catalysts and directional thermal wells turn organic material in low-grade carbon-bearing strata into mobile hydrocarbons. Fine drainage channels gather the liquids into collection zones. The laboratory’s first bottle of crude has put once-worthless core samples back into the board’s resource accounts.\n\nThe Group requests permission for this year’s regional deployment in one incorporated state. It will pay equipment and survey costs, while production wells will still be constructed normally."
 super_company_oil.1.f: "\"Why is there no oilfield on this map?\"\n\"See the next sheet. That is the map after the work is finished.\"\n\n—Correspondence between the design office and survey department"
 super_company_oil.1.a: "Authorize deployment and designate the conversion area."
 super_company_oil.2.t: "Subsurface Distillation Grid: Choose a Deployment Area"
 super_company_oil.2.d: "The engineering office has completed its modular designs for thermal wells and catalyst-recovery equipment. Choose a fully incorporated state whose entire state region belongs to our country.\n\nEach page lists up to four sites. Final approval permanently adds #bold 50#! levels of oil rig resource capacity in the selected state. Production wells still require normal construction and workers."
 super_company_oil.2.empty.d: "Changes in land registration and administration have left no eligible deployment areas on the shortlist. The engineering office must withdraw the instruction; this year’s project can be postponed."
 super_company_oil.2.f: "The well diagram folds to the size of a map. Its engineer insists on calling it a process chart."
 super_company_oil.3.t: "Subsurface Distillation Grid: Turn the Process Chart into an Oilfield"
 super_company_oil.3.d: "The subsurface operating area in [SCOPE.sState('super_company_oil_selected_state').GetName] has been designated. Engineers will connect thermal wells, catalyst-return pipes, and collection channels, converting previously unusable carbon-bearing strata into a workable oil source.\n\nSigning the instruction permanently adds #bold 50#! levels of oil rig resource capacity in this state. The Petrochemical Giant pays this year’s development costs. New oil rigs still require normal construction, workers, and the usual unlocking technology."
 super_company_oil.3.invalid.d: "The deployment instruction is no longer authorized. The Petrochemical Giant may have been dissolved, or the selected state may no longer be fully incorporated and entirely ours. Redesignate the site or postpone this year’s work."
 super_company_oil.3.f: "The first black drop falls into a measuring glass. In the control room, the duty engineer does not cheer. The delivery sheet receives one short entry: \"The supply location now exists.\""
 super_company_oil.3.a: "Sign the instruction and connect the distillation grid."
 super_company_oil.previous: "Previous deployment areas."
 super_company_oil.next: "Next deployment areas."
 super_company_oil.back: "Redesignate the oil-development site."
 super_company_oil.cancel: "Withdraw the instruction. Postpone this year’s deployment."
 super_company_oil_choose_tt: "Choose a fully owned, incorporated state to permanently add #bold 50#! levels of oil rig resource capacity."
 super_company_oil_preview_tt: "Review the subsurface deployment instruction. Oil rig resource capacity changes only after final approval."
 super_company_oil_page_tt: "Continue reviewing deployment areas without using this year’s oil-development opportunity."
 super_company_oil_cancel_tt: "No oil resources are added this year. Future annual deployments remain available while the Petrochemical Giant exists."
 super_company_oil_gain_tt: "[SCOPE.sState('super_company_oil_selected_state').GetName] permanently gains #bold 50#! levels of oil rig resource capacity. The Group pays development costs. No oil rigs or oil goods are created automatically."
