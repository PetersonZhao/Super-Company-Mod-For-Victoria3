l_english:
 super_company_reclamation.1.t: "International Commercial Group: A Loom for the Land"
 super_company_reclamation.1.d: "At a trade fair for grain merchants, the International Commercial Group unveils a stone tray covered in gravel. Silver ceramic nodules move along predetermined paths, rearranging crushed rock, river silt, and organic residue. Gravel that could not hold water yesterday now supports a layer of moist, dark soil.\n\nThe Group calls the device the Surface Loom. Miniature soil assemblers deployed across barren ground weave a growing layer that retains water, admits air, and supports roots, then connect it to a network of irrigation channels. The company requests an incorporated state for this year's deployment, turning previously unusable ground into registered farmland. The Group pays development costs; future harvests will reach the market along its existing trade routes."
 super_company_reclamation.1.f: "\"Please enter the destination on the delivery note.\"\n\"What is the cargo?\"\n\"Next season's fields.\"\n\n—Recorded at the International Commercial Group trade fair"
 super_company_reclamation.1.a: "Authorize deployment and designate the new fields."
 super_company_reclamation.2.t: "Surface Loom: Choose a Soil Conversion Site"
 super_company_reclamation.2.d: "The Group's surface engineering crew has compiled a deployment shortlist. Choose a fully incorporated state whose entire state region belongs to our country for this year's soil conversion project.\n\nEach page lists up to four states. Browse forward or back, and review your choice before final authorization. Approval permanently adds #bold 100#! arable land to the selected state."
 super_company_reclamation.2.empty.d: "Changes in ownership or incorporation have left no eligible states on the deployment shortlist. The engineers will seal the ceramic nodules in storage; this year's soil conversion must be postponed."
 super_company_reclamation.2.f: "Beside the brown patches of barren ground, the surveyor's new map has acquired another column: suitable for weaving."
 super_company_reclamation.2.state_1: "Select [SCOPE.sState('super_company_reclamation_state_1').GetName]."
 super_company_reclamation.2.state_2: "Select [SCOPE.sState('super_company_reclamation_state_2').GetName]."
 super_company_reclamation.2.state_3: "Select [SCOPE.sState('super_company_reclamation_state_3').GetName]."
 super_company_reclamation.2.state_4: "Select [SCOPE.sState('super_company_reclamation_state_4').GetName]."
 super_company_reclamation.3.t: "Surface Loom: Authorize the New Fields"
 super_company_reclamation.3.d: "[SCOPE.sState('super_company_reclamation_selected_state').GetName] has been selected for this year's conversion. Sealed cases of ceramic nodules await shipment. Engineers will deploy the soil assemblers across surveyed barren ground, laying down capillary layers to retain water and growing layers for roots, then connecting them to local irrigation.\n\nSigning the deployment contract permanently adds #bold 100#! arable land to this state and completes this year's project. The International Commercial Group pays development costs; no treasury funds are required. Farms on the new land still need normal construction and workers."
 super_company_reclamation.3.invalid.d: "The deployment contract can no longer be authorized. The International Commercial Group may have been dissolved, or the designated state may no longer be fully incorporated and entirely ours. The assemblers will remain inactive. Choose another eligible state or postpone this year's project."
 super_company_reclamation.3.f: "\"The borders on the map have not moved. The granary ledgers will need a few more pages.\"\n\n—International Commercial Group surface engineering crew"
 super_company_reclamation.3.a: "Activate the Surface Loom and register the new farmland."
 super_company_reclamation.previous: "Previous page."
 super_company_reclamation.next: "Next page."
 super_company_reclamation.back: "Return to the state list."
 super_company_reclamation.cancel: "Seal the equipment. Postpone this year's deployment."
 super_company_reclamation_choose_tt: "Choose a fully incorporated state whose entire region we own to permanently gain #bold 100#! arable land."
 super_company_reclamation_preview_tt: "Review this state's Surface Loom deployment. Arable land is only added after final approval."
 super_company_reclamation_page_tt: "Continue reviewing deployment sites without using this year's soil conversion opportunity."
 super_company_reclamation_cancel_tt: "Store this year's equipment without adding arable land. Future annual deployments remain available while the International Commercial Group exists."
 super_company_reclamation_gain_tt: "[SCOPE.sState('super_company_reclamation_selected_state').GetName] permanently gains #bold 100#! arable land. The Group pays the costs and completes this year's deployment. No farms are automatically built."
