l_english:
 super_company_rubber.1.t: "Global Automotive Industries: A Rainy Season Under Glass"
 super_company_rubber.1.d: "Three generations of engines have passed through the endurance circuit, yet their tires still depend on the harvest of a distant rainy season. Global Automotive Industries engineers have brought a piece of tropical weather into the test workshop. Behind a spectral control membrane, moisture circulates along a glass dome. Snow falls outside; inside, rubber trees still yield their milky latex.\n\nProject Perpetual Summer combines insulated enclosures, closed-loop irrigation, and rotational tapping to provide a dependable rubber supply near the automotive supply chain. The Group requests a site in one incorporated state for this year’s new production area, covering development costs and linking the new groves to its long-term supply network."
 super_company_rubber.1.f: "\"The test driver asked how far the new tires could travel. An engineer opened a frost-covered window. First, see where they grew.\"\n\n—Global Automotive Industries proving-ground minutes"
 super_company_rubber.1.a: "Authorize Project Perpetual Summer and choose a site."
 super_company_rubber.2.t: "Project Perpetual Summer: Choose a Rubber-Growing Site"
 super_company_rubber.2.d: "The Group has completed transport plans for climate enclosures and water-recovery equipment. Choose a fully incorporated state whose entire state region belongs to our country.\n\nEach page lists up to four states. Final approval permanently increases the selected state’s rubber plantation resource capacity by #bold 50#! levels. Plantations still require normal construction."
 super_company_rubber.2.empty.d: "Changes in ownership or incorporation have left no eligible sites on the shortlist. The equipment will remain in storage; this year’s deployment can be postponed."
 super_company_rubber.2.f: "The two sides of the glass wall seem separated by latitude rather than footsteps."
 super_company_rubber.3.t: "Project Perpetual Summer: Connect the White Supply Line"
 super_company_rubber.3.d: "[SCOPE.sState('super_company_rubber_selected_state').GetName] has been selected as the new rubber-growing area. Sealed seedling crates, membrane rolls, and condensers await shipment. Engineers will connect the insulated growing sites to a coordinated tapping and transport network.\n\nSigning the contract permanently adds #bold 50#! levels of rubber plantation resource capacity in this state. Global Automotive Industries pays development costs. Plantations still need construction, workers, and the normal unlocking technology."
 super_company_rubber.3.invalid.d: "The supply-development contract can no longer be authorized. Global Automotive Industries may have been dissolved, or the selected state may no longer be fully incorporated and entirely ours. Choose another site or postpone this year’s deployment."
 super_company_rubber.3.f: "\"Where the wheels go, the supply line follows. Now even the rainy season can be shipped.\"\n\n—The Group’s supply engineering office"
 super_company_rubber.3.a: "Sign the contract and deploy the climate enclosures."
 super_company_rubber.previous: "Previous rubber-growing sites."
 super_company_rubber.next: "Next rubber-growing sites."
 super_company_rubber.back: "Choose another rubber-growing site."
 super_company_rubber.cancel: "Store the equipment. Postpone this year’s deployment."
 super_company_rubber_choose_tt: "Choose a fully owned, incorporated state to permanently add #bold 50#! levels of rubber plantation resource capacity."
 super_company_rubber_preview_tt: "Review the climate-enclosure deployment. Resource capacity changes only after final approval."
 super_company_rubber_page_tt: "Continue reviewing sites without using this year’s rubber development opportunity."
 super_company_rubber_cancel_tt: "No rubber resources are added this year. Future annual projects remain available while Global Automotive Industries exists."
 super_company_rubber_gain_tt: "[SCOPE.sState('super_company_rubber_selected_state').GetName] permanently gains #bold 50#! levels of rubber plantation resource capacity. The Group pays development costs. No plantations or rubber goods are created automatically."
