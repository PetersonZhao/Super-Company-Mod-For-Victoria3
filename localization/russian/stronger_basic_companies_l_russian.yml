 company_tech_industrial_group: "Технологическая промышленная группа"
 company_tech_industrial_group_desc: "Исследовательская электротехническая группа, развивающая энергетику, электронику, радио и высшее образование."
 company_global_mining_resources_group: "Глобальная горнодобывающая группа"
 company_global_mining_resources_group_desc: "Интегрированное горнодобывающее предприятие по добыче железа, угля, серы, свинца и золота."

