l_simp_chinese:
 super_company_commercial.1.t: "国际商业集团：众资成业"
 super_company_commercial.1.d: "国际商业集团迎来了繁荣。来自农场、纺织厂、食品作坊与港口的账簿，第一次被汇总成一份足以让各地投资者共同审阅的报表。商人们发现，规模庞大的企业不必只靠一家人的积蓄维系：将资本拆分为可以认购和转让的股份，就能让更多人分担风险，也分享收益。\n\n集团愿意公开这套筹资与管理办法，将股东名册、分红章程和统一核算制度交给国内的学者与商会研究，同时推动存款、信贷与票据结算业务，并提出建立中央银行、协调银行清算与货币发行的方案。这次繁荣，为股份公司、银行业与中央银行的发展提供了现成的范本。"
 super_company_commercial.1.f: "“一张股票买不到整座工厂，却能让千百人的积蓄，一起点燃炉火。”"
 super_company_commercial.1.a: "让这份繁荣成为众人的事业。"
