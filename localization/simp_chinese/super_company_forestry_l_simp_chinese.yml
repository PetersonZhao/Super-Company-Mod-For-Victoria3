l_simp_chinese:
 super_company_forestry.1.t: "国际金融集团：会生长的抵押品"
 super_company_forestry.1.d: "国际金融集团的年度股东大会上，一只玻璃匣子被抬上长桌。匣中幼树的枝条正缓缓顶开铜框，而旁边的账簿上，昨日登记的树高已经作废。\n\n集团发行的“年轮债券”资助了一批实验苗圃：脉冲电场与共生菌培育出的速生树种，能将漫长的成材周期压缩到几个生长季，再以分区轮伐维持稳定林源。银行家打算把这份突破变成下一代抵押品——会自行增值的森林。\n\n集团愿用本年度专项基金，在一个已整合地区扩建育林基地并登记新的轮伐林区。它们的红利将以木材、纸张和工具的形式进入市场。"
 super_company_forestry.1.f: "“现金躺在金库里不会长大。我们的抵押品每天都在长高。”\n\n——国际金融集团林业资产部，致股东的公开信"
 super_company_forestry.1.a: "将本年度基金投向新的林区。"
 super_company_forestry.2.t: "年轮债券：选择育林地区"
 super_company_forestry.2.d: "林业资产部已列出可承接本年度投资的地区。请选择一个由本国完整拥有、已经完成整合的州。\n\n每页最多四个地区，可以前后翻页。最终签署后，所选地区的伐木营地可建等级上限永久增加#bold 50#!级；现有农田和其他资源不受影响。"
 super_company_forestry.2.empty.d: "土地登记已发生变化，原名单中的地区都不再满足投资条件。林业资产部建议封存本年度专项基金，待以后重新选择合适的育林地区。"
 super_company_forestry.2.f: "“我们买下的不是这一季的木材，而是此后每一季都能送来的原木。”\n\n——林业资产评估报告"
 super_company_forestry.3.t: "年轮债券：将收益写进森林"
 super_company_forestry.3.d: "[SCOPE.sState('super_company_forestry_selected_state').GetName]的林界与苗圃用地已经核定。装着树种和菌床的玻璃箱即将运抵，林业人员会按轮伐周期划分经营区，把实验苗圃的成果转为长期林木储备。\n\n签署投资契约后，该地区的伐木营地可建等级上限永久增加#bold 50#!级。本年度费用由国际金融集团承担；伐木营地仍需正常建设与雇工。"
 super_company_forestry.3.invalid.d: "这份林业投资契约已无法执行：国际金融集团可能已经解散，或所选地区的归属、整合情况发生了变化。可以返回重选地区，或封存本年度基金。"
 super_company_forestry.3.f: "“收益预测：向上。树梢也是。”\n\n——集团审计员在契约页边的批注"
 super_company_forestry.3.a: "签署契约，让森林开始计息。"
 super_company_forestry.previous: "上一页林区。"
 super_company_forestry.next: "下一页林区。"
 super_company_forestry.back: "重新评估投资地区。"
 super_company_forestry.cancel: "封存本年度林业基金。"
 super_company_forestry_choose_tt: "选择一个完整拥有的已整合州，为其永久增加#bold 50#!级伐木资源上限。"
 super_company_forestry_preview_tt: "审阅该地区的育林投资契约，确认后才会增加伐木资源上限。"
 super_company_forestry_page_tt: "继续审阅地区名单，不消耗本年度的林业投资机会。"
 super_company_forestry_cancel_tt: "本年度不增加伐木资源。国际金融集团仍然存在时，未来年度可以重新提出投资。"
 super_company_forestry_gain_tt: "[SCOPE.sState('super_company_forestry_selected_state').GetName]的伐木营地可建等级上限永久增加#bold 50#!级。集团承担开发费用；不会自动建成伐木营地。"
