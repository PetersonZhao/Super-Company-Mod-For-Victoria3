l_simp_chinese:
 super_company_minerals.1.t: "全球矿业资源集团：地底的第二次敲击"
 super_company_minerals.1.d: "【勘探站密电，02时17分】\n钻头停转后，井下仍传来三次等距敲击。全球矿业资源集团的“回声引擎”随即在记录纸上绘出一层没有出现在任何旧地图上的深部矿带。\n\n这台由重力摆、晶体振荡器与差分机组成的装置，能把地层微震译成三维剖面，为定向钻井找出通道。集团申请将本年度仅有的一次全功率校准，用于国内一个已整合地区，锁定一种目标矿产，把过去无法定位和利用的深层矿体纳入可开采储量。\n\n铁、煤、铅、硫，或黄金——地底还有哪一种回声，正等着我们听见？"
 super_company_minerals.1.f: "“我们发出的是两次脉冲。第三次是谁敲的？”\n\n——值夜测量员写在密电背面的附注"
 super_company_minerals.1.a: "批准校准，先确定勘探地区。"
 super_company_minerals.2.t: "回声引擎：布设勘探阵列"
 super_company_minerals.2.d: "先选择一个由本国完整拥有、已经完成整合的地区，作为本年度共振阵列的中心。测量员将在当地布设重力摆与接收井。\n\n名单每页最多四个地区。选定地区后，再从铁、煤、铅、硫或黄金中选择一种；只有最后启动引擎时，才会永久增加#bold 50#!级对应矿产的可开发上限。"
 super_company_minerals.2.empty.d: "原定接收井的地籍与行政归属已改变，名单中的地区均无法部署阵列。本年度校准只能中止，等待以后重新确定勘探区域。"
 super_company_minerals.2.f: "接收井里没有风，悬线上的铜锤却偏向了同一个方向。"
 super_company_minerals.3.t: "回声引擎：最后一次校准"
 super_company_minerals.3.invalid.d: "控制台亮起了红灯。集团授权或地区条件已经失效，也可能尚未锁定有效矿种。当前校准不能执行；请重新选择地区或中止本年度任务。"
 super_company_minerals.3.f: "“井壁在震动，纸带在前进。所有人后退，别碰那枚自己转动的指针。”\n\n——现场工程师的操作记录"
 super_company_minerals.3.a: "启动引擎，登记新矿脉。"
 super_company_minerals.4.t: "回声译码：选择目标矿层"
 super_company_minerals.4.d: "[SCOPE.sState('super_company_minerals_selected_state').GetName]的接收阵列已经接通。五组波形在纸带上交错，每组都对应一种不同的深部矿层。\n\n本年度的全功率校准只能锁定一种目标。请选择铁、煤、铅、硫或黄金；随后仍可检查地区与矿种，再决定是否正式启动。"
 super_company_minerals.4.invalid.d: "阵列尚未取得有效的地区授权。所选地区可能已易手、被分割或失去已整合状态，集团也可能已经解散。请返回检查部署地区，或中止本年度任务。"
 super_company_minerals.4.f: "五条曲线中，代表黄金的那条最细，也最像人的心跳。"
 super_company_minerals.4.iron: "铁：追踪赤色矿层。"
 super_company_minerals.4.coal: "煤：追踪深部碳层。"
 super_company_minerals.4.lead: "铅：追踪沉重的灰色回声。"
 super_company_minerals.4.sulfur: "硫：追踪地下热液通道。"
 super_company_minerals.4.gold: "黄金：追踪最微弱的回声。"
 super_company_minerals.previous: "上一组勘探地区。"
 super_company_minerals.next: "下一组勘探地区。"
 super_company_minerals.back: "重新部署勘探地区。"
 super_company_minerals.change_resource: "重新译码，改选矿种。"
 super_company_minerals.cancel: "切断电源，中止本年度校准。"
 super_company_minerals_choose_tt: "选择地区及一种矿产，最终批准后永久增加#bold 50#!级对应矿场的可开发上限。"
 super_company_minerals_preview_tt: "在该地区继续选择铁、煤、铅、硫或黄金；此时不改变矿产储量。"
 super_company_minerals_page_tt: "重新检查部署地区，不消耗本年度校准机会。"
 super_company_minerals_resource_choice_tt: "重新选择目标矿种，不改变任何资源，也不消耗本年度机会。"
 super_company_minerals_cancel_tt: "本年度不增加矿产。全球矿业资源集团仍然存在时，未来年度可以再次校准。"
 super_company_minerals_gain_tt: "[SCOPE.sState('super_company_minerals_selected_state').GetName]所选矿种的可建矿场上限永久增加#bold 50#!级，其他矿种不变。集团承担勘探费用；矿场仍需正常建设。"
 super_company_minerals.3.iron.d: "目标地区：[SCOPE.sState('super_company_minerals_selected_state').GetName]。目标矿种：#bold 铁矿#!。\n\n赤色矿层的裂隙与旧矿道相接，过去无法抵达的铁矿体如今已有了可行的开采路线。\n\n启动回声引擎后，只为该地区永久增加#bold 50#!级铁矿可建等级上限。其他矿种不变，勘探费用由全球矿业资源集团承担。矿场仍需正常建设与雇工。"
 super_company_minerals_select_iron_tt: "锁定铁矿，进入最终确认。批准前不会增加或消耗资源。"
 super_company_minerals.3.coal.d: "目标地区：[SCOPE.sState('super_company_minerals_selected_state').GetName]。目标矿种：#bold 煤矿#!。\n\n重叠的碳层在剖面上连成黑色长带，曾被断层隔开的深部煤田已经找到了进入通道。\n\n启动回声引擎后，只为该地区永久增加#bold 50#!级煤矿可建等级上限。其他矿种不变，勘探费用由全球矿业资源集团承担。矿场仍需正常建设与雇工。"
 super_company_minerals_select_coal_tt: "锁定煤矿，进入最终确认。批准前不会增加或消耗资源。"
 super_company_minerals.3.lead.d: "目标地区：[SCOPE.sState('super_company_minerals_selected_state').GetName]。目标矿种：#bold 铅矿#!。\n\n沉重的灰色波形指向一片深埋的方铅矿体，定向井将绕过破碎带，接近此前漏测的矿层。\n\n启动回声引擎后，只为该地区永久增加#bold 50#!级铅矿可建等级上限。其他矿种不变，勘探费用由全球矿业资源集团承担。矿场仍需正常建设与雇工。"
 super_company_minerals_select_lead_tt: "锁定铅矿，进入最终确认。批准前不会增加或消耗资源。"
 super_company_minerals.3.sulfur.d: "目标地区：[SCOPE.sState('super_company_minerals_selected_state').GetName]。目标矿种：#bold 硫矿#!。\n\n地下热液通道被逐一标记，冷凝硫矿体的边界终于从杂乱的噪声中显露出来。\n\n启动回声引擎后，只为该地区永久增加#bold 50#!级硫矿可建等级上限。其他矿种不变，勘探费用由全球矿业资源集团承担。矿场仍需正常建设与雇工。"
 super_company_minerals_select_sulfur_tt: "锁定硫矿，进入最终确认。批准前不会增加或消耗资源。"
 super_company_minerals.3.gold.d: "目标地区：[SCOPE.sState('super_company_minerals_selected_state').GetName]。目标矿种：#bold 金矿#!。\n\n最细的波形在深处汇成一束，微粒金脉沿着旧热液裂隙延伸，已经能够通过新的井道开采。\n\n启动回声引擎后，只为该地区永久增加#bold 50#!级金矿可建等级上限。其他矿种不变，勘探费用由全球矿业资源集团承担。矿场仍需正常建设与雇工。"
 super_company_minerals_select_gold_tt: "锁定金矿，进入最终确认。批准前不会增加或消耗资源。"
 super_company_minerals.2.state_1: "部署于[SCOPE.sState('super_company_minerals_state_1').GetName]。"
 super_company_minerals.2.state_2: "部署于[SCOPE.sState('super_company_minerals_state_2').GetName]。"
