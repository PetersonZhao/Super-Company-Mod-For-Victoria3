l_simp_chinese:
 super_company_oil.1.t: "石油化工巨头：第零号油田"
 super_company_oil.1.d: "石油化工巨头的设计室送来一张奇怪的蓝图：井架下方没有画出油藏，只有一组纵横交错的热井、回流管和催化反应床。工程师把它称为“地层蒸馏网”。\n\n循环催化液与定向热井能将低品位含碳层中的有机质转化为可流动的烃，再经微型导流通道汇入集油区。实验室递交的第一瓶样油，让原本被判作无价值的岩芯重新出现在董事会的资源账册上。\n\n集团请求批准本年度的一次区域部署，在国内一个已整合地区建立新的可开发油源。设备与勘察费用均由公司承担，生产井则按常规方式建设。"
 super_company_oil.1.f: "“这张图上怎么没有油田？”\n“请看下一张。那是工程结束后的地图。”\n\n——设计室与勘探部的往来记录"
 super_company_oil.1.a: "批准部署，指定地层改造区域。"
 super_company_oil.2.t: "地层蒸馏网：选择部署区域"
 super_company_oil.2.d: "工程部已经完成热井与催化液回收装置的模块设计。请选择一个由本国完整拥有、已经完成整合的州，作为本年度部署区域。\n\n名单每页最多四个地区。最终批准后，所选地区的油井资源上限永久增加#bold 50#!级。生产油井仍需正常建设与雇工。"
 super_company_oil.2.empty.d: "施工区域的地籍与行政授权已经变化，原名单中没有符合条件的地区。工程部将收回部署指令，本年度项目可以暂缓。"
 super_company_oil.2.f: "测井图被折成地图大小，工程师却坚持称它为“工艺图”。"
 super_company_oil.3.t: "地层蒸馏网：让工艺图成为油田"
 super_company_oil.3.d: "[SCOPE.sState('super_company_oil_selected_state').GetName]的地下作业区域已经划定。工程队将连接热井、催化液回流管与集油通道，使过去无法利用的含碳层成为可开发油源。\n\n签署部署指令后，该地区的油井资源上限永久增加#bold 50#!级。石油化工巨头承担本年度开发费用；新增油井仍需正常建设、雇工并满足原有技术要求。"
 super_company_oil.3.invalid.d: "部署指令的授权已失效：石油化工巨头可能已经解散，或所选地区已不再完整属于本国、尚未完成整合。请重新划定部署地区，或暂缓本年度工程。"
 super_company_oil.3.f: "控制室里，第一滴黑色液体落进量杯。值班工程师没有欢呼，只在交付表上写下：“供货地点现已存在。”"
 super_company_oil.3.a: "签署指令，接通地层蒸馏网。"
 super_company_oil.previous: "上一组部署区域。"
 super_company_oil.next: "下一组部署区域。"
 super_company_oil.back: "重新划定油源开发地区。"
 super_company_oil.cancel: "撤回指令，暂缓本年度部署。"
 super_company_oil_choose_tt: "选择一个完整拥有的已整合州，永久增加#bold 50#!级油井资源上限。"
 super_company_oil_preview_tt: "审阅该地区的地层蒸馏网部署指令，确认后才会增加油井资源上限。"
 super_company_oil_page_tt: "继续检查候选部署地区，不消耗本年度的油源开发机会。"
 super_company_oil_cancel_tt: "本年度不增加油井资源。石油化工巨头仍然存在时，未来年度可以重新部署。"
 super_company_oil_gain_tt: "[SCOPE.sState('super_company_oil_selected_state').GetName]的油井资源上限永久增加#bold 50#!级。集团承担开发费用，不会自动建成油井或发放石油商品。"
 super_company_oil.2.state_1: "选择[SCOPE.sState('super_company_oil_state_1').GetName]。"
