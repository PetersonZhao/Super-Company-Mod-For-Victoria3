l_simp_chinese:
 super_company_reclamation.1.t: "国际商业集团：大地的织机"
 super_company_reclamation.1.d: "一场面向粮商的订货会上，国际商业集团展出了一只铺满砂砾的石盘。银色的“编土结节”沿着预设纹路移动，将碎岩、河泥和有机余料重新排列；昨日还留不住水的砂砾，此刻已经托起一层湿润的黑土。\n\n集团将这套装置称为“地表织机”。铺入荒地的微型土壤装配器，能够编出蓄水、通气并供根系扎入的耕作层，再接入缓释灌溉网。公司申请将本年度的一套装置部署到一个已整合地区，把原本无法耕种的土地纳入农田名册。开发费用由集团承担，未来的收成则会沿着现有商路进入市场。"
 super_company_reclamation.1.f: "“请在收货单上填写目的地。”\n“货物是什么？”\n“下一季的田野。”\n\n——国际商业集团订货会现场记录"
 super_company_reclamation.1.a: "批准部署，选定新的田野。"
 super_company_reclamation.2.t: "地表织机：选择土壤改造地区"
 super_company_reclamation.2.d: "集团的地表工程队已整理出装配器的部署清单。请选择一个由本国完整拥有、且已完成整合的地区，承接本年度的土壤改造工程。\n\n每页最多列出四个地区，可以前后翻页。选定后仍可返回重选；最终批准铺设后，该地区将永久增加#bold 100#!可耕土地。"
 super_company_reclamation.2.empty.d: "由于地区归属或整合情况发生变化，原有部署清单中已没有符合条件的地区。工程队将封存编土结节，本年度的地表改造只能暂缓。"
 super_company_reclamation.2.f: "勘测员的新地图上，褐色的荒地旁多了一栏：可编织。"
 super_company_reclamation.2.state_1: "选择[SCOPE.sState('super_company_reclamation_state_1').GetName]。"
 super_company_reclamation.2.state_2: "选择[SCOPE.sState('super_company_reclamation_state_2').GetName]。"
 super_company_reclamation.2.state_3: "选择[SCOPE.sState('super_company_reclamation_state_3').GetName]。"
 super_company_reclamation.2.state_4: "选择[SCOPE.sState('super_company_reclamation_state_4').GetName]。"
 super_company_reclamation.3.t: "地表织机：签发新的田野"
 super_company_reclamation.3.d: "[SCOPE.sState('super_company_reclamation_selected_state').GetName]已被选为本年度的改造地区。装有编土结节的密封货箱即将送达；工程队将把土壤装配器沿规划线铺入荒地，逐层构建蓄水毛细层与根系生长层，再与当地水利系统相连。\n\n签署部署委托后，该地区将永久增加#bold 100#!可耕土地，本年度计划随即结束。国际商业集团承担开发费用，无须国库支出；新增耕地上的农场仍需正常建设与雇工。"
 super_company_reclamation.3.invalid.d: "部署委托已不具备执行条件：国际商业集团可能已经解散，或原定地区已不再由本国完整拥有、尚未完成整合。装配器不会启动，请重新选择符合条件的地区，或暂缓本年度计划。"
 super_company_reclamation.3.f: "“地图的边界没有移动。粮仓的账簿，却要多准备几页。”\n\n——国际商业集团地表工程队"
 super_company_reclamation.3.a: "启动地表织机，登记新耕地。"
 super_company_reclamation.previous: "上一页。"
 super_company_reclamation.next: "下一页。"
 super_company_reclamation.back: "返回地区名单。"
 super_company_reclamation.cancel: "封存装置，暂缓本年度部署。"
 super_company_reclamation_choose_tt: "选择一个由本国完整拥有的已整合地区，永久增加#bold 100#!可耕土地。"
 super_company_reclamation_preview_tt: "审阅该地区的地表织机部署委托，确认后才会增加可耕土地。"
 super_company_reclamation_page_tt: "继续浏览部署地区，不消耗本年度的土壤改造机会。"
 super_company_reclamation_cancel_tt: "封存本年度装置，不增加可耕土地。只要国际商业集团仍然存在，之后每年仍可重新提出部署计划。"
 super_company_reclamation_gain_tt: "[SCOPE.sState('super_company_reclamation_selected_state').GetName]永久增加#bold 100#!可耕土地。集团承担费用，本年度部署完成；不会自动建成农场。"
