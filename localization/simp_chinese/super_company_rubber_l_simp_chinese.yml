l_simp_chinese:
 super_company_rubber.1.t: "全球汽车工业集团：把雨季装进玻璃"
 super_company_rubber.1.d: "耐久试验场上的发动机已经换过三代，轮胎却仍要等待远方雨季的收成。全球汽车工业集团的工程师于是把一段热带气候搬进了试验车间：透过光谱调节膜，水汽沿着穹顶内壁循环，外面飘雪，里面的橡胶树仍在流出乳白色的胶液。\n\n这项“恒夏计划”以保温穹顶、闭路灌溉和分区采胶维持稳定林源，让橡胶供应能够跟随汽车产业布局。集团申请在国内一个已整合地区建设本年度的新产区，由公司承担开发费用，并将新增胶林纳入长期供货网络。"
 super_company_rubber.1.f: "“试车员问新轮胎能跑多远。工程师把一扇结霜的窗户推开：先看看它是在哪里长出来的。”\n\n——全球汽车工业集团试验场纪要"
 super_company_rubber.1.a: "批准恒夏计划，选择新产区。"
 super_company_rubber.2.t: "恒夏计划：选择胶林产区"
 super_company_rubber.2.d: "集团已经完成气候舱与水循环设备的运输规划。请选择一个由本国完整拥有、已经完成整合的州，部署本年度的新产区。\n\n每页最多四个地区，可以前后翻页。最终批准后，所选地区的橡胶种植园资源上限永久增加#bold 50#!级。种植园仍需正常建设。"
 super_company_rubber.2.empty.d: "原定产区的土地归属或整合情况已经变化，现有名单中没有能够部署恒夏设施的地区。设备将暂存仓库，本年度计划可以暂缓。"
 super_company_rubber.2.f: "玻璃墙两侧隔着的仿佛不是几个脚步，而是两条纬线。"
 super_company_rubber.3.t: "恒夏计划：接通白色供应线"
 super_company_rubber.3.d: "[SCOPE.sState('super_company_rubber_selected_state').GetName]已被选为新的橡胶产区。密封苗箱、薄膜卷材和冷凝设备正在装运，工程队将把分散的保温种植区接入统一采胶与运输网络。\n\n签署供货开发委托后，该地区的橡胶种植园资源上限永久增加#bold 50#!级。全球汽车工业集团承担开发费用；新增种植园仍需建设、雇工并遵循原有技术要求。"
 super_company_rubber.3.invalid.d: "供货开发委托暂时无法生效：全球汽车工业集团可能已经解散，或所选地区已不再完整属于本国、尚未完成整合。请重新选择产区，或暂缓本年度计划。"
 super_company_rubber.3.f: "“车轮走到哪里，供应线就延伸到哪里。现在，连雨季也能随船出发了。”\n\n——集团供应工程部"
 super_company_rubber.3.a: "签署委托，让恒夏设施投入部署。"
 super_company_rubber.previous: "上一组胶林产区。"
 super_company_rubber.next: "下一组胶林产区。"
 super_company_rubber.back: "重新选择橡胶产区。"
 super_company_rubber.cancel: "封存设备，暂缓本年度计划。"
 super_company_rubber_choose_tt: "选择一个完整拥有的已整合州，永久增加#bold 50#!级橡胶种植园资源上限。"
 super_company_rubber_preview_tt: "审阅该地区的恒夏设施部署委托，最终确认后才会增加资源上限。"
 super_company_rubber_page_tt: "继续查看候选产区，不消耗本年度的橡胶开发机会。"
 super_company_rubber_cancel_tt: "本年度不增加橡胶资源。全球汽车工业集团仍然存在时，未来年度可以重新提出计划。"
 super_company_rubber_gain_tt: "[SCOPE.sState('super_company_rubber_selected_state').GetName]的橡胶种植园资源上限永久增加#bold 50#!级。集团承担开发费用，不会自动建成种植园或发放橡胶商品。"
 super_company_rubber.2.state_1: "选择[SCOPE.sState('super_company_rubber_state_1').GetName]。"
 super_company_rubber.2.state_2: "选择[SCOPE.sState('super_company_rubber_state_2').GetName]。"
 super_company_rubber.2.state_3: "选择[SCOPE.sState('super_company_rubber_state_3').GetName]。"
 super_company_rubber.2.state_4: "选择[SCOPE.sState('super_company_rubber_state_4').GetName]。"
